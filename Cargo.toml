[workspace]
resolver = "2"
members = [
    "crates/fvrs-core",
    "crates/fvrs-cli",
    "crates/fvrs-gui-egui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FVRS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fvrs/fvrs"
homepage = "https://github.com/fvrs/fvrs"
description = "File Version and Restore System - A powerful file management tool"

[workspace.dependencies]
# Internal crates
fvrs-core = { path = "crates/fvrs-core" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Windows API (consumed only by fvrs-core under [target.'cfg(windows)'.dependencies])
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
] }

# Plugin loading (kept for the pending P3 plugin decision)
libloading = "0.9"

# Serialization & time
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system utilities
walkdir = "2.5"
notify = "8.2"
glob = "0.3"
open = "5.3"

# Text & patterns
regex = "1.12"
encoding_rs = "0.8"

# Hashing (RustCrypto digest 0.11 family + BLAKE3)
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
ripemd = "0.2"
# `pure` forces the portable pure-Rust implementation (no C/asm build scripts);
# accepted perf tradeoff per COOLJAPAN Pure Rust Policy.
blake3 = { version = "1.8.5", features = ["pure"] }
hex = "0.4"

# GUI stack (egui family 0.35)
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["file"] }
rfd = "0.17"
arboard = "3.6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Archives (COOLJAPAN Pure Rust: OxiARC)
oxiarc-archive = "0.3.4"
oxiarc-core = "0.3.4"
oxiarc-deflate = "0.3.4"
oxiarc-lzhuf = "0.3.4"

# RAR (C++ unrar binding; consumed only behind the non-default `rar` feature)
unrar = "0.5.8"
