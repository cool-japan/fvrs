[package]
name = "fvrs-gui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "fvrs-gui"
path = "src/main.rs"

[dependencies]
fvrs-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arboard = { workspace = true }

# 圧縮ファイル処理 (COOLJAPAN Pure Rust: oxiarc)
oxiarc-archive = { workspace = true }
oxiarc-core = { workspace = true }
oxiarc-deflate = { workspace = true }
oxiarc-lzhuf = { workspace = true }
encoding_rs = { workspace = true }
unrar = { workspace = true, optional = true }

[features]
default = ["clipboard"]
clipboard = []
# RAR 対応 (C++ の unrar ライブラリに依存するため既定では無効)
rar = ["dep:unrar"]
